# Override for local dev and E2E: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d --build --wait

x-motus-dev: &motus-dev
  image: motus:dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  environment:
    MOTUS_LOGIN_RATE_LIMIT: "1000"
    MOTUS_API_RATE_LIMIT: "10000"

services:
  migrate: *motus-dev

  seed:
    <<: *motus-dev
    command: ["user", "add", "--email", "admin@motus.local", "--name", "Admin User", "--password", "adminadmin", "--role", "admin"]

  motus: *motus-dev
