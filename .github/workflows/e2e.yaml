name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [regular, oidc]
        include:
          - mode: regular
            compose: -f docker-compose.yaml -f docker-compose.dev.yaml
            projects: --project=setup --project=chromium --project=auth
          - mode: oidc
            compose: -f docker-compose.yaml -f docker-compose.dev.yaml -f docker-compose.oidc.yaml
            projects: --project=oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add keycloak to /etc/hosts
        if: matrix.mode == 'oidc'
        run: echo "127.0.0.1 keycloak" | sudo tee -a /etc/hosts

      - name: Start app stack
        run: docker compose ${{ matrix.compose }} up -d --build --wait

      - name: Show container logs
        if: failure()
        run: docker compose ${{ matrix.compose }} logs

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Retention is managed by GitHub Actions cache policy (default: 7 days).
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install frontend deps
        working-directory: ./web
        run: npm ci

      - name: Install Playwright OS dependencies
        working-directory: ./web
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        working-directory: ./web
        run: npx playwright install chromium

      - name: Run E2E tests
        working-directory: ./web
        run: npx playwright test ${{ matrix.projects }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.mode }}
          path: web/playwright-report/
