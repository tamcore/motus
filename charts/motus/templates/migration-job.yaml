apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "motus.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "motus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "motus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- end }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/motus", "wait-for-db"]
        env:
        - name: MOTUS_ENV
          value: "development"
        {{- include "motus.databaseEnv" . | nindent 8 }}
      containers:
      - name: migration
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ with .Values.image.digest }}@{{ . }}{{ end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/motus", "db-migrate"]
        env:
        - name: MOTUS_ENV
          value: "development"
        {{- include "motus.databaseEnv" . | nindent 8 }}
