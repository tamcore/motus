{{- if and .Values.redis.enabled (not .Values.redis.external.url) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "motus.componentFullname" (list . "redis") }}
  labels:
    {{- include "motus.componentLabels" (list . "cache" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: redis
    name: redis
  selector:
    {{- include "motus.componentSelectorLabels" (list . "redis") | nindent 4 }}
{{- end }}
